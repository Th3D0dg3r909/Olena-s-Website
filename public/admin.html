<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planning | Olena Skin Care Studio</title>
<link rel="stylesheet" href="/style.css"><script defer src="/admin.js"></script>
</head>
<body class="planner">
<header><a class="brand" href="/">Olena <span>Skin Care Studio</span></a><a href="/">Bekijk website ↗</a></header>
<main>
<h1>Planning</h1>
<div class="planner-toolbar">
<h2 id="selected-day"></h2>
<div class="planner-controls">
<button type="button" data-step="-1" aria-label="Vorige dag">←</button>
<button type="button" id="today">Vandaag</button>
<button type="button" data-step="1" aria-label="Volgende dag">→</button>
<input id="planning-day" type="date" aria-label="Kies een datum" required>
</div>
</div>
<div class="planner-grid">
<section aria-labelledby="slots-title">
<h2 id="slots-title">Beschikbaarheid</h2>
<p id="planning-status" role="status"></p>
<div id="planning-slots"></div>
</section>
<section aria-labelledby="bookings-title">
<h2 id="bookings-title">Aanvragen en afspraken</h2>
<p>Stuur de klant zelf een e-mail nadat je een aanvraag hebt verwerkt.</p>
<p id="status" role="status"></p>
<div id="bookings"></div>
</section>
</div>
</main>
</body>
</html>
